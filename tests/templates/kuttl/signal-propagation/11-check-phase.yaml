---
# This is a TestStep and not a TestAssert on purpose. kuttl retries an assert until it
# times out, so a wrong-but-terminal phase could only ever be reported after the full
# timeout. A TestStep command runs once, which lets us fail as soon as the application
# reaches a terminal phase and say why.
apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  # Deliberately above the script's own budget below, so that on a timeout the script
  # reports the last phase it saw instead of kuttl killing it with a generic message.
  - timeout: 960
    script: |
      set -eu

      timeout_seconds=900
      interval_seconds=5

      phase=""
      elapsed=0
      while [ "$elapsed" -lt "$timeout_seconds" ]; do
        phase=$(kubectl -n "$NAMESPACE" get sparkapplication failure-propagation \
          -o jsonpath='{.status.phase}' 2>/dev/null || true)

        case "$phase" in
          Failed)
            echo "OK: the failing application was reported as Failed"
            exit 0
            ;;
          Succeeded)
            echo "FAIL: the application failed at runtime but was reported as Succeeded."
            echo "The driver container exit code was masked between the Spark process and"
            echo "the container entrypoint (see spark-k8s/stackable/run-spark.sh)."
            exit 1
            ;;
        esac

        sleep "$interval_seconds"
        elapsed=$((elapsed + interval_seconds))
      done

      echo "FAIL: no terminal phase after ${timeout_seconds}s (last seen: '${phase}')"
      exit 1
