---
name: prek

on:
  pull_request:
  merge_group:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  NIX_PKG_MANAGER_VERSION: "2.35.4"
  RUST_TOOLCHAIN_VERSION: "nightly-2026-11-02"
  HADOLINT_VERSION: "v2.15.1"
