# Run tests with `./test-vector.sh`
#
# A downside of these test cases is that they compare the whole event and that the message can
# contain source code positions in vector.yaml, e.g. "function call error for \"parse_xml\" at
# (584:643)". Please adapt the tests if you change VRL code in vector.yaml.
---
tests:
  - name: Test stdout log entry
    inputs:
      - type: log
        insert_at: processed_files_stdout
        log_fields:
          file: /stackable/log/spark/spark.stdout.log
          message: Starting Spark
          pod: spark-node-default-0
          source_type: file
          timestamp: 2025-10-02T09:27:28.582Z
    outputs:
      - extract_from: extended_logs
        expected_event_count: 1
        conditions:
          - type: vrl
            source: |
              expected_log_event = {
                "cluster": "spark",
                "container": "spark",
                "file": "spark.stdout.log",
                "level": "INFO",
                "logger": "ROOT",
                "message": "Starting Spark",
                "namespace": "default",
                "pod": "spark-node-default-0",
                "role": "node",
                "roleGroup": "default",
                "timestamp": "2025-10-02T09:27:28.582Z"
              }

              assert_eq!(expected_log_event, .)
  - name: Test stderr log entry
    inputs:
      - type: log
        insert_at: processed_files_stderr
        log_fields:
          file: /stackable/log/spark/spark.stderr.log
          message: "Exception in thread \"main\""
          pod: spark-node-default-0
          source_type: file
          timestamp: 2025-10-02T09:27:28.582Z
    outputs:
      - extract_from: extended_logs
        expected_event_count: 1
        conditions:
          - type: vrl
            source: |
              expected_log_event = {
                "cluster": "spark",
                "container": "spark",
                "file": "spark.stderr.log",
                "level": "ERROR",
                "logger": "ROOT",
                "message": "Exception in thread \"main\"",
                "namespace": "default",
                "pod": "spark-node-default-0",
                "role": "node",
                "roleGroup": "default",
                "timestamp": "2025-10-02T09:27:28.582Z"
              }

              assert_eq!(expected_log_event, .)
  - name: Test log4j2 XML log entry without stacktrace
    inputs:
      - type: log
        insert_at: processed_files_log4j2
        log_fields:
          file: /stackable/log/spark/spark.log4j2.xml
          message: >
            <Event xmlns="http://logging.apache.org/log4j/2.0/events"
            timeMillis="1759397248582" level="INFO"
            loggerName="org.apache.spark.deploy.history.HistoryServer"
            thread="main"><Message>Bound HistoryServer to 0.0.0.0, and started at
            http://spark:18080</Message></Event>
          pod: spark-node-default-0
          source_type: file
          timestamp: 2025-10-02T09:27:29.473487331Z
    outputs:
      - extract_from: extended_logs
        expected_event_count: 1
        conditions:
          - type: vrl
            source: |
              expected_log_event = {
                "cluster": "spark",
                "container": "spark",
                "file": "spark.log4j2.xml",
                "level": "INFO",
                "logger": "org.apache.spark.deploy.history.HistoryServer",
                "message": "Bound HistoryServer to 0.0.0.0, and started at http://spark:18080",
                "namespace": "default",
                "pod": "spark-node-default-0",
                "role": "node",
                "roleGroup": "default",
                "timestamp": t'2025-10-02T09:27:28.582Z'
              }

              assert_eq!(expected_log_event, .)
  - name: Test tracing-rs log
    inputs:
      - type: log
        insert_at: processed_files_tracing_rs
        log_fields:
          file: /stackable/log/containerdebug/containerdebug.2026-11-02-14.tracing-rs.json
          message: '{"timestamp":"2026-11-02T14:49:28.028922Z","level":"INFO","fields":{"message":"found disk","disk.name":"overlay"},"target":"containerdebug::system_information::disk"}'
          pod: spark-node-default-0
          source_type: file
          timestamp: 2026-11-02T14:49:29.473487331Z
    outputs:
      - extract_from: extended_logs
        expected_event_count: 1
        conditions:
          - type: vrl
            source: |
              expected_log_event = {
                "cluster": "spark",
                "container": "containerdebug",
                "file": "containerdebug.2026-11-02-14.tracing-rs.json",
                "level": "INFO",
                "logger": "containerdebug::system_information::disk",
                "message": "found disk\n\ndisk.name=overlay",
                "timestamp": t'2026-11-02T14:49:28.028922Z',
                "namespace": "default",
                "pod": "spark-node-default-0",
                "role": "node",
                "roleGroup": "default"
              }

              assert_eq!(expected_log_event, .)
  - name: Test unparsable tracing-rs log
    inputs:
      - type: log
        insert_at: processed_files_tracing_rs
        log_fields:
          file: /stackable/log/containerdebug/containerdebug.2026-11-02-14.tracing-rs.json
          message: '{ unparsable'
          pod: spark-node-default-0
          source_type: file
          timestamp: 2026-11-02T14:49:29.473487331Z
    outputs:
      - extract_from: extended_logs
        expected_event_count: 1
        conditions:
          - type: vrl
            source: |
              expected_log_event = {
                "cluster": "spark",
                "container": "containerdebug",
                "errors": [
                  .errors[0]
                ],
                "file": "containerdebug.2026-11-02-14.tracing-rs.json",
                "level": "INFO",
                "logger": "",
                "message": "{ unparsable",
                "timestamp": .timestamp,
                "namespace": "default",
                "pod": "spark-node-default-0",
                "role": "node",
                "roleGroup": "default"
              }

              assert_eq!(expected_log_event, .)

              # The remainder of the message contains character offsets into
              # the VRL source, so only the stable prefix is asserted.
              assert!(starts_with!(.errors[0], "JSON not parsable: "))
  - name: Test tracing-rs log which is not a JSON object
    inputs:
      - type: log
        insert_at: processed_files_tracing_rs
        log_fields:
          file: /stackable/log/containerdebug/containerdebug.2026-11-02-14.tracing-rs.json
          message: 'false'
          pod: spark-node-default-0
          source_type: file
          timestamp: 2026-11-02T14:49:29.473487331Z
    outputs:
      - extract_from: extended_logs
        expected_event_count: 1
        conditions:
          - type: vrl
            source: |
              expected_log_event = {
                "cluster": "spark",
                "container": "containerdebug",
                "errors": [
                  "Parsed event is not a JSON object."
                ],
                "file": "containerdebug.2026-11-02-14.tracing-rs.json",
                "level": "INFO",
                "logger": "",
                "message": "false",
                "timestamp": .timestamp,
                "namespace": "default",
                "pod": "spark-node-default-0",
                "role": "node",
                "roleGroup": "default"
              }

              assert_eq!(expected_log_event, .)
  - name: Test tracing-rs log with invalid fields
    inputs:
      - type: log
        insert_at: processed_files_tracing_rs
        log_fields:
          file: /stackable/log/containerdebug/containerdebug.2026-11-02-14.tracing-rs.json
          message: '{"timestamp":"unparsable","level":"INVALID","fields":"none","target":null}'
          pod: spark-node-default-0
          source_type: file
          timestamp: 2026-11-02T14:49:29.473487331Z
    outputs:
      - extract_from: extended_logs
        expected_event_count: 1
        conditions:
          - type: vrl
            source: |
              expected_log_event = {
                "cluster": "spark",
                "container": "containerdebug",
                "errors": [
                  .errors[0],
                  "Logger/target not found.",
                  "Level \"INVALID\" unknown, using \"INFO\" instead.",
                  "Fields are not an object."
                ],
                "file": "containerdebug.2026-11-02-14.tracing-rs.json",
                "level": "INFO",
                "logger": "",
                "message": "{\"timestamp\":\"unparsable\",\"level\":\"INVALID\",\"fields\":\"none\",\"target\":null}",
                "timestamp": .timestamp,
                "namespace": "default",
                "pod": "spark-node-default-0",
                "role": "node",
                "roleGroup": "default"
              }

              assert_eq!(expected_log_event, .)

              # The remainder of the message contains character offsets into
              # the VRL source, so only the stable prefix is asserted.
              assert!(starts_with!(.errors[0], "Timestamp not parsable, using current time instead: "))
  - name: Test tracing-rs log without a timestamp
    inputs:
      - type: log
        insert_at: processed_files_tracing_rs
        log_fields:
          file: /stackable/log/containerdebug/containerdebug.2026-11-02-14.tracing-rs.json
          message: '{"level":"INFO","fields":{"message":"found disk"},"target":"containerdebug::system_information::disk"}'
          pod: spark-node-default-0
          source_type: file
          timestamp: 2026-11-02T14:49:29.473487331Z
    outputs:
      - extract_from: extended_logs
        expected_event_count: 1
        conditions:
          - type: vrl
            source: |
              expected_log_event = {
                "cluster": "spark",
                "container": "containerdebug",
                "errors": [
                  "Timestamp not found, using current time instead."
                ],
                "file": "containerdebug.2026-11-02-14.tracing-rs.json",
                "level": "INFO",
                "logger": "containerdebug::system_information::disk",
                "message": "found disk",
                "timestamp": .timestamp,
                "namespace": "default",
                "pod": "spark-node-default-0",
                "role": "node",
                "roleGroup": "default"
              }

              assert_eq!(expected_log_event, .)

              # The current time is used and not the timestamp which the file
              # source attached to the event. The latter reaches the transform
              # as a string, whereas now() yields a timestamp.
              assert!(is_timestamp(.timestamp))
  - name: Test tracing-rs log without a message but with other fields
    inputs:
      - type: log
        insert_at: processed_files_tracing_rs
        log_fields:
          file: /stackable/log/containerdebug/containerdebug.2026-11-02-14.tracing-rs.json
          message: '{"timestamp":"2026-11-02T14:49:28.028922Z","level":"INFO","fields":{"disk.name":"overlay"},"target":"containerdebug::system_information::disk"}'
          pod: spark-node-default-0
          source_type: file
          timestamp: 2026-11-02T14:49:29.473487331Z
    outputs:
      - extract_from: extended_logs
        expected_event_count: 1
        conditions:
          - type: vrl
            source: |
              expected_log_event = {
                "cluster": "spark",
                "container": "containerdebug",
                "file": "containerdebug.2026-11-02-14.tracing-rs.json",
                "level": "INFO",
                "logger": "containerdebug::system_information::disk",
                "message": "disk.name=overlay",
                "timestamp": t'2026-11-02T14:49:28.028922Z',
                "namespace": "default",
                "pod": "spark-node-default-0",
                "role": "node",
                "roleGroup": "default"
              }

              assert_eq!(expected_log_event, .)
  - name: Test tracing-rs log with a message which is not a string
    inputs:
      - type: log
        insert_at: processed_files_tracing_rs
        log_fields:
          file: /stackable/log/containerdebug/containerdebug.2026-11-02-14.tracing-rs.json
          message: '{"timestamp":"2026-11-02T14:49:28.028922Z","level":"INFO","fields":{"message":42,"disk.name":"overlay"},"target":"containerdebug::system_information::disk"}'
          pod: spark-node-default-0
          source_type: file
          timestamp: 2026-11-02T14:49:29.473487331Z
    outputs:
      - extract_from: extended_logs
        expected_event_count: 1
        conditions:
          - type: vrl
            source: |
              expected_log_event = {
                "cluster": "spark",
                "container": "containerdebug",
                "file": "containerdebug.2026-11-02-14.tracing-rs.json",
                "level": "INFO",
                "logger": "containerdebug::system_information::disk",
                "message": "disk.name=overlay\nmessage=42",
                "timestamp": t'2026-11-02T14:49:28.028922Z',
                "namespace": "default",
                "pod": "spark-node-default-0",
                "role": "node",
                "roleGroup": "default"
              }

              assert_eq!(expected_log_event, .)
  - name: Test tracing-rs log without any fields
    inputs:
      - type: log
        insert_at: processed_files_tracing_rs
        log_fields:
          file: /stackable/log/containerdebug/containerdebug.2026-11-02-14.tracing-rs.json
          message: '{"timestamp":"2026-11-02T14:49:28.028922Z","level":"INFO","fields":{},"target":"containerdebug::system_information::disk"}'
          pod: spark-node-default-0
          source_type: file
          timestamp: 2026-11-02T14:49:29.473487331Z
    outputs:
      - extract_from: extended_logs
        expected_event_count: 1
        conditions:
          - type: vrl
            source: |
              expected_log_event = {
                "cluster": "spark",
                "container": "containerdebug",
                "errors": [
                  "Message not found."
                ],
                "file": "containerdebug.2026-11-02-14.tracing-rs.json",
                "level": "INFO",
                "logger": "containerdebug::system_information::disk",
                "message": "",
                "timestamp": t'2026-11-02T14:49:28.028922Z',
                "namespace": "default",
                "pod": "spark-node-default-0",
                "role": "node",
                "roleGroup": "default"
              }

              assert_eq!(expected_log_event, .)
  - name: Test Vector internal logs
    inputs:
      - type: log
        insert_at: filtered_logs_vector
        log_fields:
          arch: x86_64
          message: Vector has started.
          metadata:
            kind: event
            level: INFO
            module_path: vector::internal_events::process
            target: vector
          pid: 14
          pod: spark-node-default-0
          source_type: internal_logs
          timestamp: 2025-10-02T09:46:14.479381097Z
          version: 0.49.0
    outputs:
      - extract_from: extended_logs
        expected_event_count: 1
        conditions:
          - type: vrl
            source: |
              expected_log_event = {
                "arch": "x86_64",
                "cluster": "spark",
                "container": "vector",
                "level": "INFO",
                "logger": "vector::internal_events::process",
                "message": "Vector has started.",
                "namespace": "default",
                "pod": "spark-node-default-0",
                "role": "node",
                "roleGroup": "default",
                "timestamp": "2025-10-02T09:46:14.479381097Z",
                "version": "0.49.0"
              }

              assert_eq!(expected_log_event, .)
  - name: Test Vector internal log level filtering - INFO passes
    inputs:
      - type: log
        insert_at: filtered_logs_vector
        log_fields:
          metadata:
            level: INFO
    outputs:
      - extract_from: filtered_logs_vector
        expected_event_count: 1
        conditions:
          - type: vrl
            source: |
              assert_eq!("INFO", .metadata.level)
  - name: Test Vector internal log level filtering - DEBUG dropped
    inputs:
      - type: log
        insert_at: filtered_logs_vector
        log_fields:
          metadata:
            level: DEBUG
    no_outputs_from:
      - filtered_logs_vector
