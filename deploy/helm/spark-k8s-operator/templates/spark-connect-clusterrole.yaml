---
# The Spark Connect Server acts as a long-running Spark driver that uses Kubernetes-native
# scheduling to launch and manage executor pods. It interacts directly with the Kubernetes
# API at runtime to create executor pods and the supporting resources they need.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spark-connect-clusterrole
  labels:
  {{- include "spark-k8s-operator.labels" . | nindent 4 }}
rules:
  # The Spark Connect Server manages executor pods and their supporting resources at runtime.
  - apiGroups:
      - ""
    resources:
      - configmaps
      - persistentvolumeclaims
      - pods
      - secrets
      - services
    verbs:
      - create
      - delete
      - deletecollection
      - get
      - list
      - patch
      - update
      - watch
  # Spark 4.2 and later apply (server-side) a NetworkPolicy for the executor pods. It is owned by
  # the driver pod and thereby garbage collected, so no delete is needed.
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - create
      - patch
{{ if .Capabilities.APIVersions.Has "security.openshift.io/v1" }}
  - apiGroups:
      - security.openshift.io
    resources:
      - securitycontextconstraints
    resourceNames:
      - nonroot-v2
    verbs:
      - use
{{ end }}
