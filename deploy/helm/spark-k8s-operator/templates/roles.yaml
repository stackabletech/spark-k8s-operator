---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "operator.fullname" . }}-clusterrole
  labels:
  {{- include "operator.labels" . | nindent 4 }}
rules:
  # For automatic cluster domain detection.
  - apiGroups:
      - ""
    resources:
      - nodes/proxy
    verbs:
      - get
  # ConfigMaps hold pod templates and Spark configuration. All three controllers apply
  # them via Server-Side Apply (create + patch). The history and connect controllers
  # track them for orphan cleanup (list + delete). All controllers watch ConfigMaps via
  # .owns(ConfigMap) so that changes trigger re-reconciliation.
  # get is required for the ReconciliationPaused strategy in cluster_resources.add().
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - watch
  # Services expose Spark History Server and Spark Connect Server for metrics and
  # inter-component communication, and the app controller creates a headless driver Service per
  # SparkApplication so executors can reach the driver in client mode. Applied via Server-Side
  # Apply and tracked for orphan cleanup by the history and connect controllers. The app, history
  # and connect controllers watch Services via .owns(Service) to trigger re-reconciliation on change.
  # get is required for the ReconciliationPaused strategy in cluster_resources.add().
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - watch
  # ServiceAccounts are created per SparkApplication (directly via client.apply_patch,
  # referencing spark-k8s-clusterrole) and per SparkHistoryServer/SparkConnectServer
  # (via cluster_resources.add). The history and connect controllers track them for
  # orphan cleanup (list + delete). No controller watches ServiceAccounts via .owns().
  # get is required for the ReconciliationPaused strategy in cluster_resources.add().
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    verbs:
      - create
      - delete
      - get
      - list
      - patch
  # RoleBindings are created per SparkApplication (directly via client.apply_patch,
  # binding to spark-k8s-clusterrole) and per SparkHistoryServer/SparkConnectServer
  # (via cluster_resources.add, binding to their respective ClusterRoles). The history
  # and connect controllers track them for orphan cleanup (list + delete).
  # No controller watches RoleBindings via .owns().
  # get is required for the ReconciliationPaused strategy in cluster_resources.add().
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - rolebindings
    verbs:
      - create
      - delete
      - get
      - list
      - patch
  # Required to create RoleBindings that reference these ClusterRoles.
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterroles
    verbs:
      - bind
    resourceNames:
      - {{ include "operator.name" . }}-clusterrole
      - spark-history-clusterrole
      - spark-connect-clusterrole
  # StatefulSets run the Spark History Server and Spark Connect Server. Applied via
  # Server-Side Apply (create + patch), tracked for orphan cleanup (list + delete),
  # and watched by the history and connect controllers via .owns(StatefulSet).
  # get is required for the ReconciliationPaused strategy in cluster_resources.add().
  - apiGroups:
      - apps
    resources:
      - statefulsets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - watch
  # The driver Job is created per SparkApplication via Server-Side Apply. The app controller
  # applies Jobs directly (create + patch via SSA) and watches them via .owns(Job) to track
  # SparkApplication progress, so get + list + watch are also required. Jobs are garbage collected
  # via their owner reference and ttlSecondsAfterFinished, so no explicit delete is needed.
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - get
      - list
      - patch
      - watch
  # PodDisruptionBudgets limit voluntary disruptions to Spark History Server pods.
  # Applied via Server-Side Apply and tracked for orphan cleanup by the history
  # controller. No controller watches PDBs via .owns().
  # get is required for the ReconciliationPaused strategy in cluster_resources.add().
  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
  # The operator can maintain its own CRDs, e.g. to update conversion webhook certificates.
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      # Required to maintain the CRD. The operator needs to do this, as it needs to enter e.g. its
      # generated certificate in the conversion webhook.
      {{- if .Values.maintenance.customResourceDefinitions.maintain }}
      - create
      - patch
      {{- end }}
      # Required for startup condition
      - list
      - watch
  # The operator emits Kubernetes events.
  - apiGroups:
      - events.k8s.io
    resources:
      - events
    verbs:
      - create
      - patch
  # The custom resources reconciled by this operator.
  - apiGroups:
      - spark.stackable.tech
    resources:
      - sparkapplications
      - sparkhistoryservers
      - sparkconnectservers
      - sparkapptemplates
    verbs:
      - get
      - list
      - watch
  # Status updates for SparkApplication and SparkConnectServer.
  - apiGroups:
      - spark.stackable.tech
    resources:
      - sparkapplications/status
      - sparkconnectservers/status
    verbs:
      - patch
  # S3 configuration for event log storage and data access.
  - apiGroups:
      - s3.stackable.tech
    resources:
      - s3connections
      - s3buckets
    verbs:
      - get
      - list
      - watch
  # Required for managing how the History Server and Connect Server are exposed
  # outside of the cluster.
  - apiGroups:
      - listeners.stackable.tech
    resources:
      - listeners
    verbs:
      - create
      - delete
      - get
      - list
      - patch
