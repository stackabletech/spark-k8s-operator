---
# Verify the OpenLineage events actually reached the receiver. In the TLS scenario this also proves
# the driver trusted the secret-operator-issued cert end-to-end (a failed handshake would mean no
# body files were written).
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 120
commands:
  - script: |
      POD=$(kubectl get -n "$NAMESPACE" pod -l app=openlineage-receiver -o jsonpath='{.items[0].metadata.name}')
      # At least one lineage event body was persisted, mentioning our job name ...
      kubectl exec -n "$NAMESPACE" "$POD" -- sh -c 'cat /tmp/lineage/* 2>/dev/null | grep -q "openlineage-test-app"'
      # ... and a COMPLETE run event was received (the job finished and reported lineage).
      kubectl exec -n "$NAMESPACE" "$POD" -- sh -c 'cat /tmp/lineage/* 2>/dev/null | grep -q "COMPLETE"'
