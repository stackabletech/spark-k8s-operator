---
dimensions:
  - name: openshift
    values:
      - "false"
  - name: spark
    values:
      - 4.1.2
      - 4.1.3
      - 4.2.0
      # Alternatively, if you want to use a custom image, append a comma and the full image name to the product version
      # as in the example below.
      # - 3.5.6,oci.stackable.tech/sandbox/spark-k8s:3.5.6-stackable0.0.0-dev
  - name: spark-logging
    values:
      - 4.1.2
      - 4.1.3
      - 4.2.0
  - name: spark-hbase-connector
    values:
      # - 4.1.2  # skip this version to reduce the number of tests
      - 4.1.3
      - 4.2.0
  - name: spark-delta-lake
    values:
      - 4.1.2
      - 4.1.3
      - 4.2.0
      # - 3.5.6,oci.stackable.tech/sandbox/spark-k8s:3.5.6-stackable0.0.0-dev
  # Note: We keep this list, as new Spark versions are only supported delayed by Iceberg
  - name: spark-iceberg
    values:
      - 4.1.2
      - 4.1.3
      # - 4.2.0 # No iceberg-spark-runtime-4.2 release yet
  - name: iceberg-latest
    values:
      - 1.11.0
  - name: hive-iceberg
    values:
      - 4.0.0
  - name: spark-connect
    values:
      - 4.1.2
      - 4.1.3
      # - 4.2.0 # No iceberg-spark-runtime-4.2 release yet
      # - 3.5.6,oci.stackable.tech/sandbox/spark-k8s:3.5.6-stackable0.0.0-dev
  - name: spark-regression
    values:
      - 4.2.0
  - name: krb5
    values:
      - 1.21.1
  - name: kerberos-realm
    values:
      - "CLUSTER.LOCAL"
  - name: hbase
    values:
      - 2.6.7
  - name: hdfs-latest
    values:
      - 3.5.0
  - name: zookeeper-latest
    values:
      - 3.9.6
  - name: ny-tlc-report
    values:
      - 0.3.0
  - name: s3-use-tls
    values:
      - "false"
      - "true"
tests:
  - name: smoke
    dimensions:
      - spark
      - s3-use-tls
      - openshift
  - name: overrides
    dimensions:
      - spark
      - openshift
  - name: config-overrides
    dimensions:
      - spark
      - openshift
  - name: spark-history-server
    dimensions:
      - spark
      - s3-use-tls
      - openshift
  - name: spark-pi-private-s3
    dimensions:
      - spark
      - openshift
  - name: spark-examples
    dimensions:
      - spark
      - openshift
  - name: signal-propagation
    dimensions:
      - spark
      - openshift
  - name: graceful-shutdown
    dimensions:
      - spark
      - openshift
  - name: pyspark-ny-public-s3
    dimensions:
      - spark
      - openshift
  - name: pyspark-ny-public-s3-image
    dimensions:
      - spark
      - ny-tlc-report
      - openshift
  - name: resources
    dimensions:
      - spark
      - openshift
  - name: transit-encryption
    dimensions:
      - spark
      - openshift
  - name: logging
    dimensions:
      - spark-logging
      - ny-tlc-report
      - openshift
  - name: iceberg
    dimensions:
      - spark-iceberg
      - iceberg-latest
      - openshift
  - name: delta-lake
    dimensions:
      - spark-delta-lake
      - openshift
  - name: hbase-connector
    dimensions:
      - spark-hbase-connector
      - hbase
      - hdfs-latest
      - zookeeper-latest
      - openshift
  - name: custom-log-directory
    dimensions:
      - spark
      - hdfs-latest
      - zookeeper-latest
      - openshift
  - name: spark-connect
    dimensions:
      - spark-connect
      - iceberg-latest
      - hive-iceberg
      - openshift
      - s3-use-tls
  - name: product-config-compat
    dimensions:
      - spark-regression
      - openshift
  - name: spark-connect-kerberos
    dimensions:
      - spark-connect
      - iceberg-latest
      - hive-iceberg
      - krb5
      - kerberos-realm
      - openshift
      - s3-use-tls

suites:
  - name: nightly
    patch:
      - dimensions:
          - expr: last
          - name: s3-use-tls
            expr: "true"
  - name: smoke-latest
    select:
      - smoke
    patch:
      - dimensions:
          - expr: last
  - name: openshift
    patch:
      - dimensions:
          - expr: last
          - name: openshift
            expr: "true"
          - name: s3-use-tls
            expr: "true"
