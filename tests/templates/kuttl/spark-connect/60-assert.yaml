---
# The recreated StatefulSet must come back to ready, and the recreated objects must
# carry an owner reference back to the SparkConnectServer so that garbage collection
# still works for them.
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
metadata:
  name: recreate-owned-resources
timeout: 600
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spark-connect-server
  ownerReferences:
    - apiVersion: spark.stackable.tech/v1alpha1
      controller: true
      kind: SparkConnectServer
      name: spark-connect
status:
  readyReplicas: 1
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-connect-serviceaccount
  ownerReferences:
    - apiVersion: spark.stackable.tech/v1alpha1
      controller: true
      kind: SparkConnectServer
      name: spark-connect
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-connect-rolebinding
  ownerReferences:
    - apiVersion: spark.stackable.tech/v1alpha1
      controller: true
      kind: SparkConnectServer
      name: spark-connect
---
apiVersion: listeners.stackable.tech/v1alpha1
kind: Listener
metadata:
  name: spark-connect-server
  ownerReferences:
    - apiVersion: spark.stackable.tech/v1alpha1
      controller: true
      kind: SparkConnectServer
      name: spark-connect
---
apiVersion: v1
kind: Service
metadata:
  name: spark-connect-server-headless
  ownerReferences:
    - apiVersion: spark.stackable.tech/v1alpha1
      controller: true
      kind: SparkConnectServer
      name: spark-connect
---
apiVersion: v1
kind: Service
metadata:
  name: spark-connect-server-metrics
  ownerReferences:
    - apiVersion: spark.stackable.tech/v1alpha1
      controller: true
      kind: SparkConnectServer
      name: spark-connect
