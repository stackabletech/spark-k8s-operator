# Default values for spark-k8s-operator.
---
image:
  # Registry and namespace holding the operator image, without the image name.
  # Set when the chart is packaged, from the registry it is published to, so it is
  # normally already correct. Override it to pull from a mirror.
  # repository: oci.stackable.tech/sdp

  # Registry and namespace holding the product images, if they should come from
  # somewhere other than image.repository. Credentials for that registry are
  # configured per cluster in spec.image.pullSecrets on the custom resource, not here.
  # productRepository: oci.stackable.tech/sdp

  # Overrides the operator image tag, which defaults to the chart appVersion.
  # tag: 0.0.0-dev

  pullPolicy: IfNotPresent
  pullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # Leave empty to use the generated name, <release>-spark-k8s-operator-serviceaccount.
  # Required when create is false, so that the Deployment and the ClusterRoleBinding
  # know which existing service account to use.
  name: ""

podAnnotations: {}

# Provide additional labels which get attached to all deployed resources
labels:
  stackable.tech/vendor: Stackable

# Satisfies the restricted Pod Security Standard.
# Already standard on OpenShift.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  # Not part of the restricted profile.
  # Anything the operator writes has to go to a mounted volume.
  readOnlyRootFilesystem: true

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

# PriorityClass for the operator pod. Unset means the cluster default.
# priorityClassName: system-cluster-critical

# When running on a non-default Kubernetes cluster domain, the cluster domain can be configured here.
# See the https://docs.stackable.tech/home/stable/guides/kubernetes-cluster-domain guide for details.
# kubernetesClusterDomain: my-cluster.local

maintenance:
  endOfSupportCheck:
    enabled: true
    # mode: offline
    # interval: 24h

  customResourceDefinitions:
    maintain: true

# See all available options and detailed explanations about the concept here:
# https://docs.stackable.tech/home/stable/concepts/telemetry/
telemetry:
  consoleLog:
    enabled: true
  fileLog:
    enabled: false
    rotationPeriod: hourly
    maxFiles: 6
  otelLogExporter:
    enabled: false
  otelTraceExporter:
    enabled: false
